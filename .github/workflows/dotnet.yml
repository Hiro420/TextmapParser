name: Windows Build

permissions:
  actions: write
  contents: write

on:
  push:
    branches:
      - main
    paths:
      - "**.cs"
      - "**.xaml"
      - "**.csproj"
  pull_request:
    branches:
      - main
    paths:
      - "**.cs"
      - "**.xaml"
      - "**.csproj"
  workflow_dispatch:

jobs:
  package:
    name: Compile and Package
    runs-on: windows-latest

    strategy:
      matrix:
        include:
          - rid: win-x64
            mode: bundled
            single_file: true
            output: artifacts/win-x64-bundled
          - rid: win-x64
            mode: expanded
            single_file: false
            output: artifacts/win-x64-expanded

    steps:
      - name: Fetch source
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore project packages
        run: dotnet restore TextmapParser\TextmapParser.csproj

      - name: Publish for ${{ matrix.rid }} (${{ matrix.mode }})
        run: >
          dotnet publish TextmapParser\TextmapParser.csproj
          --configuration Release
          --framework net10.0-windows
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output ${{ matrix.output }}
          -p:PublishSingleFile=${{ matrix.single_file }}

      - name: Store package ${{ matrix.rid }}-${{ matrix.mode }}
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.rid }}-${{ matrix.mode }}
          path: ${{ matrix.output }}